# Codetective Configuration File
# This file contains default settings for the Codetective tool

detection:
  min_entropy: 3.3
  min_certainty: 0
  max_file_window_size: 1000000
  max_overlap_window_size: 5000
  min_av: 5
  max_preprocess_errors: 20
  bad_chars: "\n\r-"
  
  # Detection algorithm toggles
  enable_jwt_detection: true
  enable_secret_detection: true
  enable_web_cookie_detection: true
  enable_url_detection: true
  enable_phone_detection: true
  enable_credit_card_detection: true
  enable_hash_detection: true
  enable_database_hash_detection: true
  enable_windows_hash_detection: true
  enable_sam_hash_detection: true
  enable_base64_detection: true
  enable_uuid_detection: true
  enable_unix_hash_detection: true
  enable_web_framework_hash_detection: true
  enable_crc_detection: true

output:
  verbose: false
  show_details: true
  show_confidence: true
  show_location: true
  show_timestamp: true
  output_format: text  # text, json, csv, xml
  color_output: true
  quiet_mode: false

file_processing:
  chunk_size: 8192
  max_file_size: 104857600  # 100MB
  use_memory_mapping: true
  recursive_search: false
  follow_symlinks: false
  include_patterns: []
  exclude_patterns: []

# Global settings
log_level: INFO
log_file: null
