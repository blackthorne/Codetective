[mypy]
python_version = 3.10

# Set the project root to avoid duplicate module detection
mypy_path = .

# Be informative without being overly strict to ease adoption
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
show_error_codes = True
pretty = True

# Gradual typing settings
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
no_implicit_optional = False

# Third-party libraries may not ship stubs
ignore_missing_imports = True
follow_imports = skip

# Exclude patterns to avoid duplicate module detection
exclude = (?x)(
    ^volatility/
    )


